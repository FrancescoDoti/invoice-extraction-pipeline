[project]
name = "invx"
version = "0.1.0"
description = "Invoice extraction pipeline: PDF -> validated JSON, with arithmetic reconciliation, confidence routing to human review, and a field-level evaluation on held-out layouts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11", "pydantic>=2.6", "python-dateutil>=2.8", "pytesseract>=0.3.10", "pillow>=10"]

[project.optional-dependencies]
gen = ["reportlab>=4.0", "faker>=24", "pypdfium2>=4", "numpy>=1.24"]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "httpx>=0.27", "reportlab>=4.0", "faker>=24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invx"]
